<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUNDAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10; --panel:#101319; --panel-2:#0d0f14; --border:#23262f;
  --gold:#c7a765; --gold-soft:#9c8450; --gold-bright:#e3c585;
  --text:#ece9e2; --muted:#878c99; --danger:#b5635a;
  --serif:'Cormorant Garamond','Noto Sans Thai',serif;
  --sans:'Noto Sans Thai',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1ec; --panel:#fffdf9; --panel-2:#faf7f0; --border:#e2ddd0;
    --text:#1c1a16; --muted:#6b6457;
  }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100%; background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(199,167,101,0.08), transparent 60%),
    var(--bg);
  color:var(--text); font-family:var(--sans);
}
.wrap{max-width:760px;margin:0 auto;padding:56px 20px 64px;}

/* hero / wordmark */
.hero{text-align:center;margin-bottom:46px;}
.seal{width:46px;height:46px;margin:0 auto 18px;opacity:.92;}
.wordmark{
  font-family:var(--serif); font-weight:600; font-style:italic;
  font-size:clamp(2.6rem,7vw,3.6rem); letter-spacing:.04em; margin:0;
  color:var(--text);
}
.wordmark span{color:var(--gold);}
.tagline{
  font-family:var(--sans); color:var(--muted); font-size:.92rem;
  margin-top:10px; letter-spacing:.01em;
}
.rule{
  width:72px; height:1px; margin:24px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);
}


/* mascot */
.stage{position:relative;width:148px;height:148px;margin:0 auto 18px;}
.mascot{
  width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
  border:1px solid var(--gold-soft);
  box-shadow:0 0 0 5px var(--bg),0 0 0 6px rgba(199,167,101,.35),0 0 28px rgba(60,200,90,.18);
  animation:float 3.6s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.stage.working .mascot{
  animation:typing .18s linear infinite;
  box-shadow:0 0 0 5px var(--bg),0 0 0 6px #3ddc6a,0 0 44px rgba(61,220,106,.55);
}
@keyframes typing{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-2px,2px) rotate(-1.2deg)}
  50%{transform:translate(2px,-1px) rotate(1deg)}
  75%{transform:translate(-1px,-2px) rotate(-.8deg)}
  100%{transform:translate(0,0) rotate(0)}
}
.stage.done .mascot{animation:pop .6s ease-out 1;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.bit{
  position:absolute;bottom:20%;font-family:var(--mono);font-size:.8rem;color:#3ddc6a;
  pointer-events:none;opacity:0;animation:rise 1.3s ease-out forwards;
}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-90px)}}
.status{
  height:1.2em;margin-top:2px;font-size:.78rem;color:var(--muted);
  transition:color .2s ease;
}
.status.on{color:#3ddc6a;}
.credit{margin-top:10px;font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--gold);}
@media (prefers-reduced-motion: reduce){
  .mascot,.stage.working .mascot,.stage.done .mascot,.bit{animation:none;}
}

/* panels */
.panel{
  background:var(--panel); border:1px solid var(--border);
  border-left:2px solid var(--gold-soft);
  padding:22px 22px 20px; margin-bottom:18px; position:relative;
}
.panel h2{
  font-family:var(--serif); font-style:italic; font-weight:500;
  font-size:1.15rem; color:var(--text); margin:0 0 4px; letter-spacing:.01em;
}
.panel .sub{font-size:.78rem; color:var(--muted); margin:0 0 14px;}

textarea{
  width:100%; min-height:148px; background:var(--panel-2); color:var(--text);
  border:1px solid var(--border); padding:13px 14px;
  font-family:var(--mono); font-size:.82rem; line-height:1.6; resize:vertical;
}
textarea::placeholder{color:#555a66;}
textarea:focus{outline:none; border-color:var(--gold-soft);}

.row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
button{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  font-family:var(--sans); font-size:.85rem; font-weight:500;
  padding:10px 18px; border-radius:2px; transition:opacity .15s ease, transform .1s ease;
}
button:active{transform:scale(.98);}
button svg{width:15px;height:15px;flex-shrink:0;}

.btn-lock{background:var(--gold); color:#171206; border:1px solid var(--gold);}
.btn-lock:hover{background:var(--gold-bright); border-color:var(--gold-bright);}
.btn-copy{background:transparent; color:var(--text); border:1px solid var(--border);}
.btn-copy:hover{border-color:var(--gold-soft); color:var(--gold-bright);}
.btn-clear{background:transparent; color:var(--muted); border:1px solid transparent;}
.btn-clear:hover{color:var(--danger);}

.hint{font-size:.76rem; color:var(--muted); margin-top:12px; line-height:1.6;}
.hint::before{content:'— '; color:var(--gold-soft);}

footer{text-align:center; margin-top:40px; font-size:.74rem; color:#565a65; letter-spacing:.02em;}

.toast{
  position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(14px); background:var(--panel);
  border:1px solid var(--gold-soft); color:var(--text); padding:11px 20px;
  font-family:var(--sans); font-size:.82rem; opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

<script>
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>t.classList.remove('show'), 1600);
}

const CREDIT='SUNDAY'; // เปลี่ยนชื่อเครดิตตรงนี้
function lockLua(src){
  if(!src.trim()) return '';
  const key = 1 + Math.floor(Math.random()*254);
  const bytes = [];
  for(let i=0;i<src.length;i++){
    const code = src.charCodeAt(i) & 0xFF;
    bytes.push((code + key) % 256);
  }
  const line1 = `--[[ Locked by ${CREDIT} ]] local _K=${key};local _S={${bytes.join(',')}}`;
  const line2 = `local _O={};for _I=1,#_S do _O[_I]=string.char((_S[_I]-_K)%256) end;(loadstring or load)(table.concat(_O))()`;
  return line1 + "\n" + line2;
}

let busy=false;
function spawnBits(stage){
  for(let i=0;i<10;i++){
    const b=document.createElement('span');
    b.className='bit';
    b.textContent=Math.random()<.5?'0':'1';
    b.style.left=(10+Math.random()*80)+'%';
    b.style.animationDelay=(Math.random()*0.9)+'s';
    stage.appendChild(b);
    setTimeout(()=>b.remove(),2400);
  }
}
document.getElementById('lockBtn').addEventListener('click', ()=>{
  if(busy) return;
  const src = document.getElementById('src').value;
  const out = document.getElementById('out');
  if(!src.trim()){ showToast('กรุณาใส่โค้ดก่อน'); return; }
  const stage=document.getElementById('stage'), st=document.getElementById('status');
  busy=true; out.value='';
  stage.classList.remove('done'); stage.classList.add('working');
  st.textContent='กำลังปิดผนึก...'; st.classList.add('on');
  spawnBits(stage);
  setTimeout(()=>{
    try{ out.value = lockLua(src); showToast('ปิดผนึกสำเร็จ'); }
    catch(e){ showToast('เกิดข้อผิดพลาด'); }
    stage.classList.remove('working'); void stage.offsetWidth; stage.classList.add('done');
    st.textContent='เสร็จแล้ว'; 
    setTimeout(()=>{ st.textContent=''; st.classList.remove('on'); },1800);
    busy=false;
  },1500);
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  document.getElementById('src').value = '';
  document.getElementById('out').value = '';
  showToast('ล้างแล้ว');
});

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const out = document.getElementById('out');
  if(!out.value.trim()){ showToast('ไม่มีข้อความให้คัดลอก'); return; }
  try{
    await navigator.clipboard.writeText(out.value);
    showToast('คัดลอกแล้ว');
  }catch(e){
    out.select();
    document.execCommand('copy');
    showToast('คัดลอกแล้ว');
  }
});
</script>
</body>
